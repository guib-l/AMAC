[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amac"
dynamic = ["version"]
description = "Python wrapper for preparing inputs, launching calculations, and parsing results."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hysfard" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    # NumPy 2.2 is the last series supporting Python 3.10.
    "numpy>=2.2; python_version < '3.12'",
    "numpy>=2.5; python_version >= '3.12'",
    "ase>=3.23",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "ruff>=0.15",
]

[project.scripts]
amac-check = "amac.verify.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "amac.__version__" }

[tool.setuptools.packages.find]
include = ["amac*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start conservative: pyflakes (F) + a subset of pycodestyle (E) + isort (I).
# Broaden this list once the codebase has been formatted once.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line-too-long: handled by the formatter, not enforced yet
    "E741",  # ambiguous variable names (e.g. `l`) still present in the code
]
